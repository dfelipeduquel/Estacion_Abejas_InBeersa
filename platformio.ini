; PlatformIO Project Configuration File
; Estación Bioacústica y Bioclimática InBeersa - Semillero Kilby UTP

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidad de comunicación serial para telemetría y debug
monitor_speed = 115200
upload_speed = 115200

; Compilación C++17 modular
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINOJSON_ENABLE_STD_STRING=1

; Dependencias oficiales
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/RTClib@^2.1.4
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5

; Entorno standalone para calibración de sensores (PIR + Lluvia)
[env:calibracion]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_filter = -<*> +<../tools/calibracion/calibracion_sensores.cpp>
